[package]
name = "phantom-client-input"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "The client's input layer: key bindings and their names, mouse, controllers, clipboard and window options"

[dependencies]
phantom-client-core = { path = "../phantom-client-core" }
winit = "0.30.13"
# The window icon.
phantom-theme = { path = "../phantom-theme" }
png = "0.18"
arboard = { version = "3.6.1", default-features = false, features = ["wayland-data-control"] }
# The DualSense's trigger effects (the `controllers` feature).
phantom-dualsense = { path = "../phantom-dualsense", optional = true }

[features]
controllers = ["dep:phantom-dualsense"]

[lints]
workspace = true
